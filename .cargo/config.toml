# =============================================================================
# BCC (Blitzy's C Compiler) — Cargo Build Configuration
# =============================================================================
#
# This configuration file controls Cargo's build behavior for the BCC compiler
# project. BCC is a self-contained, zero-external-dependency C compilation
# toolchain implemented in Rust (2021 Edition) that cross-compiles C source
# code into native Linux ELF executables and shared objects for four target
# architectures: x86-64, i686, AArch64, and RISC-V 64.
#
# Key configuration decisions documented here:
#
#   1. RUST_MIN_STACK enforcement (64 MiB) for deeply recursive operations
#   2. Strict warning-as-error policy for production code quality
#   3. Linux-only build target acknowledgment
#   4. No external assembler/linker tool paths (standalone backend mandate)
#
# =============================================================================

# -----------------------------------------------------------------------------
# [env] — Runtime Environment Variables
# -----------------------------------------------------------------------------
#
# RUST_MIN_STACK sets the minimum stack size (in bytes) for threads spawned
# via the Rust standard library's thread API (std::thread::spawn and
# std::thread::Builder without an explicit stack_size).
#
# Value: 67108864 bytes = 64 MiB = 64 * 1024 * 1024
#
# The 64 MiB stack is required for the following reasons:
#
#   - The Linux kernel source contains deeply nested macro expansions that
#     the preprocessor must fully expand. Kernel headers like those in
#     include/linux/ can nest macros 50+ levels deep, and each expansion
#     frame consumes stack space in the recursive macro expander.
#
#   - The recursive-descent parser (src/frontend/parser/) may recurse deeply
#     on complex C expressions and nested compound statements. The kernel's
#     use of statement expressions ({ ... }) inside macros creates AST
#     nesting depths that exceed what a default 8 MiB stack can handle.
#
#   - A 512-depth recursion limit is enforced in the parser and macro
#     expander to prevent unbounded recursion. With each recursion frame
#     potentially consuming several kilobytes of stack for local variables,
#     512 levels * ~100 KiB/frame requires approximately 50 MiB of stack
#     space — hence the 64 MiB allocation provides necessary headroom.
#
#   - The preprocessor paint-marker system processes deeply nested token
#     streams during macro expansion. Paint markers prevent infinite
#     recursion for self-referential macros (#define A A), but the
#     expansion traversal still requires substantial stack depth for
#     legitimate deeply-nested (non-self-referential) macro chains.
#
#   - The dominator tree computation (Lengauer-Tarjan algorithm) and SSA
#     construction passes in the middle-end (src/ir/mem2reg/) can recurse
#     through large control-flow graphs generated by kernel functions with
#     hundreds of basic blocks.
#
# Note: The main thread of the BCC binary (src/main.rs) spawns a dedicated
# worker thread with an explicit 64 MiB stack via:
#     std::thread::Builder::new().stack_size(64 * 1024 * 1024)
# This environment variable serves as a safety net ensuring that ANY thread
# in the process — including those spawned by standard library internals or
# future parallel compilation phases — also receives adequate stack space.
#
[env]
RUST_MIN_STACK = "67108864"

# -----------------------------------------------------------------------------
# [build] — Default Build Settings
# -----------------------------------------------------------------------------
#
# rustflags: Compiler flags passed to every rustc invocation in this project.
#
#   -D warnings    Treat all Rust compiler warnings as hard errors. This
#                  enforces production code quality — no warning may be
#                  committed to the repository. Combined with Clippy lint
#                  checks in CI, this ensures the codebase maintains the
#                  highest quality standards expected of a compiler project.
#
# No default target is set here. Cargo automatically detects the host triple
# (e.g., x86_64-unknown-linux-gnu) and uses it as the build target. Since BCC
# is a native compiler binary that runs on the developer's Linux host machine
# (and cross-compiles C code to multiple architectures internally), there is
# no need to override the default target.
#
# Note on external tools: Per the standalone backend mandate, BCC includes its
# own built-in assembler and linker for all four target architectures (x86-64,
# i686, AArch64, RISC-V 64). Therefore, no external assembler (as), linker
# (ld), or other toolchain component paths are configured here. The BCC binary
# produces ELF output (ET_EXEC and ET_DYN) entirely through its internal
# backend pipeline without invoking any external process.
#
[build]
rustflags = ["-D", "warnings"]

# -----------------------------------------------------------------------------
# [target] — Target-Specific Configuration
# -----------------------------------------------------------------------------
#
# BCC is a Linux-only tool that produces exclusively ELF binaries. The Rust
# binary itself (the bcc compiler) is built and runs on Linux. The following
# target configuration applies to Linux hosts.
#
# No linker overrides are specified because:
#   - The system's default linker (cc/ld) is used by Cargo to link the bcc
#     Rust binary itself during `cargo build` — this is the Rust toolchain
#     linking the compiler, not BCC's own output linking.
#   - BCC's internal linker (src/backend/*/linker/) handles all C-to-ELF
#     linking for the four target architectures independently.
#
# No runner is configured for cross-architecture targets because BCC is not
# itself cross-compiled — it always runs on the host. Cross-architecture
# concerns are handled internally by BCC's code generation backends.
#
# Note: Target-specific rustflags are intentionally omitted here to avoid
# overriding the [build] section's rustflags. In Cargo, when a matching
# [target.<cfg>] section specifies rustflags, it completely replaces (not
# merges with) the [build] rustflags. The [build] section's "-D warnings"
# already applies universally to all targets, which is the desired behavior.
#
# [target.'cfg(target_os = "linux")']
# No additional target-specific flags needed beyond [build] rustflags.
