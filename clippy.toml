# =============================================================================
# Allowed Short Identifiers
# =============================================================================
# Short identifiers (below the min-chars lint threshold) that are conventional
# in compiler implementations and should not be flagged.
# =============================================================================
allowed-idents-below-min-chars = [
    "_",
    "i",
    "j",
    "k",
    "n",
    "r",
    "s",
    "b",
    "c",
